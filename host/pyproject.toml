[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-frost-host"
version = "1.6.0"
description = "Local Firefox native messaging host for Chinese subtitle detection"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "onnxruntime>=1.19,<2", "Pillow>=10,<14"]

[project.scripts]
subtitle-frost-host = "native_ocr:main"

[tool.setuptools]
py-modules = ["native_ocr", "live_ocr"]
